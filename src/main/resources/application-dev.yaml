spring:
  application:
    name: sfp
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:sfp_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2