spring:
  config:
    activate:
      on-profile: prd

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      DB_USER_PASSWORD_HASH: ${DB_USER_PASSWORD_HASH}

  devtools:
    restart:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Configuração de Documentação - PRODUÇÃO (sem detalhes sensíveis)
api:
  doc:
    title: SFP - Sistema Financeiro Particular
    description: API REST para gerenciamento de finanças pessoais com autenticação JWT
    version: 1.0.0

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: false
    filter: true
  api-docs:
    path: /v3/api-docs
